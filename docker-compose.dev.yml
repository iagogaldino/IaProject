version: '3.8'

# Override para desenvolvimento
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  app-backend:
    volumes:
      - ./app-user/app-backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  ia-backend:
    volumes:
      - ./ia-service/ia-backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  app-frontend:
    volumes:
      - ./app-user/app-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run start:docker

  ia-frontend:
    volumes:
      - ./ia-service/ia-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run start:docker
