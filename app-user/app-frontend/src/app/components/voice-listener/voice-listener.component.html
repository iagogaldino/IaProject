
<div class="voice-listener-container">
  <!-- Círculo principal com ondas sonoras -->
  <div class="voice-circle" [class.listening]="isListening">
    
    <!-- Ondas de áudio animadas -->
    <div class="audio-waves" *ngIf="isListening">
      <div 
        *ngFor="let level of audioLevels; let i = index"
        class="wave-bar"
        [style.height.px]="level"
        [style.animation-delay.ms]="i * 100">
      </div>
    </div>

    <!-- Círculos concêntricos -->
    <div class="pulse-ring pulse-ring-1" [class.active]="isListening"></div>
    <div class="pulse-ring pulse-ring-2" [class.active]="isListening"></div>
    <div class="pulse-ring pulse-ring-3" [class.active]="isListening"></div>

    <!-- Botão central -->
    <ion-button 
      (click)="toggleListening()"
      fill="clear"
      class="voice-button"
      [class.listening]="isListening">
      <ion-icon 
        [name]="isListening ? 'stop' : 'mic-outline'" 
        class="voice-icon">
      </ion-icon>
    </ion-button>

    <!-- Partículas flutuantes -->
    <div class="particles" *ngIf="isListening">
      <div class="particle" 
           *ngFor="let i of [1,2,3,4,5,6,7,8]"
           [style.animation-delay.s]="i * 0.2">
      </div>
    </div>
  </div>

</div>
