<ion-content [fullscreen]="true" class="splash-content">
  <!-- Background criativo com cores da bandeira -->
  <div class="background">
    <div class="color-gradient blue-section"></div>
    <div class="color-gradient white-section"></div>
    <div class="color-gradient yellow-section"></div>
    <div class="overlay-pattern"></div>
  </div>

  <!-- Personagem Lina -->
  <div class="lina-container">
    <!-- Círculo de energia flutuante -->
    <div class="energy-circle">
      <div class="energy-core"></div>
      <div class="energy-aura"></div>
      <div class="energy-rays">
        <div class="ray ray-1"></div>
        <div class="ray ray-2"></div>
        <div class="ray ray-3"></div>
        <div class="ray ray-4"></div>
        <div class="ray ray-5"></div>
        <div class="ray ray-6"></div>
      </div>
    </div>
    <div class="lina-character">
      <!-- Imagem da Lina -->
      <div class="lina-image-wrapper">
        <img src="assets/lina.jpeg" alt="Lina" class="lina-image" />
      </div>
    </div>
  </div>

  <!-- Balão de mensagem -->
  <div class="message-bubble">
    <div class="bubble-content">
      <div class="sender-name">Lina</div>
      <div class="message-text">
        {{ mensagemExibida }}<span class="typing-cursor" *ngIf="mensagemExibida !== mensagemCompleta">|</span>
      </div>
    </div>
  </div>

  <!-- Botão de início -->
  <div class="start-button-container">
    <ion-button 
      (click)="goToHome()" 
      class="start-button"
      fill="outline">
      VAMOS COMEÇAR
    </ion-button>
  </div>

  <!-- Loading indicator -->
  <div class="loading-indicator">
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</ion-content>
