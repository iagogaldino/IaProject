<!DOCTYPE html>
<html>
<head>
    <title>Teste de File Access</title>
</head>
<body>
    <h1>Teste de File Access</h1>
    <div id="result"></div>
    
    <script>
        // Testar se consegue carregar agentes com fileAccess
        fetch('http://localhost:3001/api/agents', {
            headers: {
                'X-API-Key': 'ai-backend-2024-abc123xyz789'
            }
        })
        .then(response => response.json())
        .then(data => {
            console.log('Agentes carregados:', data);
            
            const agentsWithFileAccess = data.data.filter(agent => 
                agent.fileAccess && agent.fileAccess.enabled
            );
            
            document.getElementById('result').innerHTML = `
                <h2>Total de agentes: ${data.data.length}</h2>
                <h2>Agentes com fileAccess: ${agentsWithFileAccess.length}</h2>
                <ul>
                    ${agentsWithFileAccess.map(agent => `
                        <li>
                            <strong>${agent.name}</strong> - 
                            Status: ${agent.status} - 
                            File Access: ${agent.fileAccess.enabled ? 'Habilitado' : 'Desabilitado'}
                        </li>
                    `).join('')}
                </ul>
            `;
        })
        .catch(error => {
            console.error('Erro:', error);
            document.getElementById('result').innerHTML = `<p style="color: red;">Erro: ${error.message}</p>`;
        });
    </script>
</body>
</html>
