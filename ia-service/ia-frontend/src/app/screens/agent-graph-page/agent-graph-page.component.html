<div class="graph-page-container">
  <!-- Header -->
  <mat-toolbar color="primary" class="page-header">
    <div class="header-content">
      <div class="header-left">
        <button 
          mat-icon-button 
          routerLink="/dashboard"
          matTooltip="Voltar ao Dashboard">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <div class="header-title">
          <mat-icon>account_tree</mat-icon>
          <span>Rede de Agentes</span>
        </div>
      </div>
      
      <div class="header-actions">
        <button 
          mat-icon-button 
          (click)="onRefresh()"
          matTooltip="Atualizar dados">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>
  </mat-toolbar>

  <!-- Main Content -->
  <div class="page-content">
    <app-agent-graph-fixed 
      [agents]="agents"
      [loading]="loading">
    </app-agent-graph-fixed>
  </div>
</div>
