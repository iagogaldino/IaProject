version: '3.8'

services:

  # App Backend
  app-backend:
    build:
      context: ./app-user/app-backend
      dockerfile: Dockerfile
    container_name: iaproject-app-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AI_BACKEND_URL=http://ia-backend:3001
      - AI_API_KEY=${AI_API_KEY}
      - AI_AGENT_ID=68dd37501d9bfcc29e34574b
    volumes:
      - ./app-user/app-backend:/app
      - /app/node_modules
    networks:
      - iaproject-network
    restart: unless-stopped

  # App Frontend (Ionic)
  app-frontend:
    build:
      context: ./app-user/app-frontend
      dockerfile: Dockerfile
    container_name: iaproject-app-frontend
    ports:
      - "4200:4200"
    networks:
      - iaproject-network
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: iaproject-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./ia-service/ia-backend/mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - iaproject-network
    restart: unless-stopped

  # MongoDB Web Interface
  mongo-express:
    image: mongo-express:latest
    container_name: iaproject-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - iaproject-network
    restart: unless-stopped

  # IA Backend
  ia-backend:
    build:
      context: ./ia-service/ia-backend
      dockerfile: Dockerfile
    container_name: iaproject-ia-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL}
      - API_KEY=${API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - iaproject-network
    restart: unless-stopped

  # IA Frontend (Admin)
  ia-frontend:
    build:
      context: ./ia-service/ia-frontend
      dockerfile: Dockerfile
    container_name: iaproject-ia-frontend
    ports:
      - "4201:4201"
    networks:
      - iaproject-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  iaproject-network:
    driver: bridge
