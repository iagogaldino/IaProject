version: '3.8'

services:

  # App Backend
  app-backend:
    build:
      context: ./app-user/app-backend
      dockerfile: Dockerfile
    container_name: iaproject-app-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AI_BACKEND_URL=http://ia-backend:3001
      - AI_API_KEY=ai-backend-2024-abc123xyz789
      - AI_AGENT_ID=68dd37501d9bfcc29e34574b
    volumes:
      - ./app-user/app-backend:/app
      - /app/node_modules
    networks:
      - iaproject-network
    restart: unless-stopped

  # App Frontend (Ionic)
  app-frontend:
    build:
      context: ./app-user/app-frontend
      dockerfile: Dockerfile
    container_name: iaproject-app-frontend
    ports:
      - "4200:4200"
    networks:
      - iaproject-network
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: iaproject-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpass
      MONGO_INITDB_DATABASE: db-ia
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./ia-service/ia-backend/mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - iaproject-network
    restart: unless-stopped

  # MongoDB Web Interface
  mongo-express:
    image: mongo-express:latest
    container_name: iaproject-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpass
      ME_CONFIG_MONGODB_URL: mongodb://admin:adminpass@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - iaproject-network
    restart: unless-stopped

  # IA Backend
  ia-backend:
    build:
      context: ./ia-service/ia-backend
      dockerfile: Dockerfile
    container_name: iaproject-ia-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:adminpass@mongodb:27017/db-ia?authSource=admin
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=db-ia
      - DB_USER=admin
      - DB_PASSWORD=adminpass
      - DB_SSL=false
      - API_KEY=ai-backend-2024-abc123xyz789
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - iaproject-network
    restart: unless-stopped

  # IA Frontend (Admin)
  ia-frontend:
    build:
      context: ./ia-service/ia-frontend
      dockerfile: Dockerfile
    container_name: iaproject-ia-frontend
    ports:
      - "4201:4201"
    networks:
      - iaproject-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  iaproject-network:
    driver: bridge
